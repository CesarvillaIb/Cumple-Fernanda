<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#120b18">

    <title>Para Fernanda ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <div class="stars">
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
        </div>

        <section class="intro">

            <p class="eyebrow">
                UNA PEQUEÑA SORPRESA PARA TI
            </p>

            <h1>
                Para<br>
                <span>Fernanda</span>
                <b>♥</b>
            </h1>

            <p class="description">
                Hay personas que llegan a nuestra vida
                y terminan convirtiéndose en nuestro
                lugar favorito.
            </p>

            <button id="openButton">
                Abrir mi sorpresa
                <span>♡</span>
            </button>

        </section>

    </main>


    <section id="story" class="story hidden">

        <div class="story-content">

            <p class="eyebrow">
                NUESTRA HISTORIA
            </p>

            <h2>
                Y pensar que todo
                comenzó contigo...
            </h2>

            <p>
                Esto apenas comienza.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
